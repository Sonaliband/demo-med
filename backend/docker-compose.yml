services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medintel
      POSTGRES_USER: medintel
      POSTGRES_PASSWORD: medintel_dev
    ports:
      - "5432:5432"
    volumes:
      - medintel-postgres:/var/lib/postgresql/data
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://medintel:medintel_dev@postgres:5432/medintel?schema=public
      JWT_SECRET: change-me-in-production
      PORT: 5000
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres
volumes:
  medintel-postgres:
